# ──────────────────────────────────────────────────────────────────────────────
# column_map.yaml  —  Kinetic Solubility (Pharmaron)
# Defines which tabs to read, how to rename columns to canonical names,
# and how to merge multi-tab data into a single working DataFrame.
# ──────────────────────────────────────────────────────────────────────────────

assay_type: kinetic_solubility
cro: pharmaron

# ── Tabs to extract ───────────────────────────────────────────────────────────
tabs:

  signature:
    sheet_name: "Signature"
    layout: key_value          # col A = key, col B = value (no header row)
    fields:
      - raw_key: "Report Name"
        canonical: "report_name"
      - raw_key: "Pharmaron Report Number"
        canonical: "report_number"
      - raw_key: "Submitted to"
        canonical: "submitted_to"
      - raw_key: "Submitted by"
        canonical: "cro_name"   # → used to populate CRO field in upload
      - raw_key: "Study Start Date"
        canonical: "study_start_date"
      - raw_key: "Report Submission Date"
        canonical: "report_submission_date"
      - raw_key: "Study Director"
        canonical: "study_director"

  materials:
    sheet_name: "Materials"
    layout: tabular             # standard header row + data rows
    header_row: 3               # 0-indexed row containing column headers
    columns:
      - raw: "Compound ID"
        canonical: "compound_id"
        required: true
      - raw: "Batch"
        canonical: "batch_id"
        required: true
      - raw: "MW (g/mol)"
        canonical: "mw_gmol"
        required: true
        dtype: float
      - raw: "FW (g/mol)"
        canonical: "fw_gmol"
        required: false
        dtype: float

  bioanalytical:
    sheet_name: "Bioanalytical Method"
    layout: tabular
    header_row: 15              # 0-indexed row with "Compound ID / Q1 / Q3 / DP / CE"
    columns:
      - raw: "Compound ID"
        canonical: "compound_id"
        required: true
      - raw: "Batch"
        canonical: "batch_id"
        required: false
      - raw: "Q1 (m/z)"
        canonical: "q1_mz"
        required: true
        dtype: float
      - raw: "Q3 (m/z)"
        canonical: "q3_mz"
        required: false
        dtype: float
      - raw: "DP (V)"
        canonical: "dp_v"
        required: true
        dtype: float
      - raw: "CE (V)"
        canonical: "ce_v"
        required: true
        dtype: float

  summary:
    sheet_name: "Summary"
    layout: tabular
    header_row: 2               # 0-indexed row with "Compound ID / Batch / Solubility..."
    columns:
      - raw: "Compound ID"
        canonical: "compound_id"
        required: true
      - raw: "Batch"
        canonical: "batch_id"
        required: true
      - raw: "Solubility (μM)"
        canonical: "solubility_um"
        required: true
        dtype: float
      - raw: "Solubility (μg/mL)"
        canonical: "solubility_ugml"
        required: false
        dtype: float

  data_analysis:
    sheet_name: "Data Analysis"
    layout: compound_blocks      # special parser — see tab_merger.py
    # Each compound block starts with a header row:
    #   col A = compound index (int) or "PC" for controls
    #   col B = compound name
    # Then rows follow:
    #   row 0 (header): compound_id, IS_name
    #   row 1 (blank row): sub-header for IS
    #   row 2..N-2: replicate rows  (sample_id, analyte_pa, is_pa, ratio, dilution, solubility_calc)
    #   row N-1: STD row
    # Block ends at next blank row.
    columns:
      # These are positional (col index) because the block has no formal headers
      - col_index: 0
        canonical: "compound_index"   # int or "PC"
      - col_index: 1
        canonical: "is_name"          # internal standard name
      - col_index: 2
        canonical: "sample_id"
      - col_index: 3
        canonical: "analyte_peak_area"
        dtype: float
      - col_index: 4
        canonical: "is_peak_area"
        dtype: float
      - col_index: 5
        canonical: "ratio"
        dtype: float
      - col_index: 6
        canonical: "dilution_or_std"  # dilution factor OR std concentration
      - col_index: 7
        canonical: "calculated_value" # solubility (µM) for replicates, %CV for last row

# ── Merge configuration ───────────────────────────────────────────────────────
merge:
  primary_tab: summary
  merge_key: compound_id        # join key across tabs

# ── Test compound filter ──────────────────────────────────────────────────────
test_compound_filter:
  strategy: prefix
  prefix: "GEN-"                # only rows where compound_id starts with this go to upload

# ── Known control compound names (excluded from upload, used in QC) ───────────
control_compounds:
  - "Progesterone"
  - "Diclofenac"
