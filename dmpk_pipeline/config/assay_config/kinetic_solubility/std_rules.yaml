assay_type: kinetic_solubility

transformations:
  - field: solubility_um
    operation: round
    decimal_places: 2
    output_field: solubility_um
  - field: compound_id
    operation: strip_whitespace
    output_field: compound_id
  - field: batch_id
    operation: strip_whitespace
    output_field: batch_id
  - field: cro_name
    operation: strip_whitespace
    output_field: cro_name
  - field: cro_name
    operation: extract_cro_name
    output_field: cro_name

upload_column_map:
  compound_id:    "Compound_ID"
  batch_id:       "batch_id"
  solubility_um:  "Solubility (μM)"
  cro_name:       "CRO"
  comment:        "Comment"

upload_columns_ordered:
  - "Compound_ID"
  - "batch_id"
  - "Solubility (μM)"
  - "CRO"
  - "Comment"

comment_rules:
  - condition: blq_detected
    value: "below lower limit of detection"
