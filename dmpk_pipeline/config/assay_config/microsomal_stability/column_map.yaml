assay_type: microsomal_stability
cro: pharmaron

tabs:
  signature:
    sheet_name: "Signature"
    layout: key_value
    fields:
      - {raw_key: "Report Name",              canonical: "report_name"}
      - {raw_key: "Pharmaron Report Number",  canonical: "report_number"}
      - {raw_key: "Submitted by",             canonical: "cro_name"}
      - {raw_key: "Study Start Date",         canonical: "study_start_date"}
      - {raw_key: "Report Submission Date",   canonical: "report_submission_date"}

  materials:
    sheet_name: "Materials"
    layout: tabular
    header_row: 3
    columns:
      - {raw: "Compound ID", canonical: "compound_id", required: true}
      - {raw: "Batch",       canonical: "batch_id",    required: true}
      - {raw: "MW (g/mol)",  canonical: "mw_gmol",     required: true, dtype: float}

  bioanalytical:
    sheet_name: "Bioanalytical Method"
    layout: tabular
    header_row: 15
    columns:
      - {raw: "Compound ID", canonical: "compound_id", required: true}
      - {raw: "Q1 (m/z)",   canonical: "q1_mz",       required: true, dtype: float}
      - {raw: "DP (V)",     canonical: "dp_v",         required: true, dtype: float}
      - {raw: "CE (V)",     canonical: "ce_v",         required: true, dtype: float}

  summary:
    sheet_name: "Summary"
    layout: tabular
    header_row: 2
    columns:
      - {raw: "Compound ID",                    canonical: "compound_id",                  required: true}
      - {raw: "Batch",                          canonical: "batch_id",                     required: true}
      - {raw: "Species",                        canonical: "species",                      required: false}
      - {raw: "in vitro t1/2 (min)",            canonical: "half_life_min",                required: false, dtype: float}
      - {raw: "in vitro CLint (uL/min/mg)",     canonical: "clint_ulminmg",                required: false, dtype: float}
      - {raw: "Scale-up CLint (mL/min/Kg)",     canonical: "scaleup_clint_mlminkg",        required: false, dtype: float}
      - {raw: "Predicted Hepatic CLH",          canonical: "predicted_clh_mlminkg",        required: false, dtype: float}
      - {raw: "Hepatic Extraction Ratio",       canonical: "hepatic_er",                   required: false, dtype: float}
      - {raw: "% Remaining No Cofactor",        canonical: "percent_remaining_no_cofactor",required: false, dtype: float}
      - {raw: "Cofactor",                       canonical: "cofactor",                     required: false}

  data_analysis:
    sheet_name: "Data Analysis"
    layout: compound_blocks
    columns:
      - {col_index: 0, canonical: "compound_index"}
      - {col_index: 1, canonical: "is_name"}
      - {col_index: 2, canonical: "sample_id"}
      - {col_index: 3, canonical: "analyte_peak_area", dtype: float}
      - {col_index: 4, canonical: "is_peak_area",      dtype: float}
      - {col_index: 5, canonical: "ratio",             dtype: float}
      - {col_index: 6, canonical: "dilution_or_std"}
      - {col_index: 7, canonical: "calculated_value"}

merge:
  primary_tab: summary
  merge_key: compound_id

test_compound_filter:
  strategy: prefix
  prefix: "GEN-"

control_compounds:
  - "Verapamil"
  - "Raloxifene"
