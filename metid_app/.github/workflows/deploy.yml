# .github/workflows/deploy.yml
# ==============================================================================
# MetID — CI/CD Pipeline
# Triggers on every push to main and on all pull requests.
#
# Jobs
# ────
#  1. quality    — black formatting check + ruff lint
#  2. test       — pytest suite with SyGMa mocked (no conda, fast)
#  3. docker     — build multi-service image, smoke-test both ports
#  4. deploy-hf  — push to Hugging Face Spaces (main branch only)
#  5. deploy-render — trigger Render deploy hook (main branch only)
#
# Required repository secrets
# ───────────────────────────
#  HF_TOKEN          Hugging Face write token (Settings → Access Tokens)
#  HF_SPACE_ID       e.g. "your-username/metid-app"
#  RENDER_DEPLOY_HOOK Full Render deploy hook URL
#                     (Render dashboard → Service → Settings → Deploy Hook)
# ==============================================================================

name: CI / CD — MetID

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: metid-app

jobs:
  # ── Job 1: Code Quality ─────────────────────────────────────────────────────
  quality:
    name: "Code Quality (black + ruff)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install quality tools
        run: pip install black>=24.3 ruff>=0.4

      - name: black — check formatting
        run: |
          echo "::group::black format check"
          black --check --diff app/ tests/
          echo "::endgroup::"

      - name: ruff — lint
        run: |
          echo "::group::ruff lint"
          ruff check app/ tests/ --output-format=github
          echo "::endgroup::"

  # ── Job 2: Tests ────────────────────────────────────────────────────────────
  test:
    name: "Unit & Integration Tests"
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies (pip, no conda)
        run: |
          pip install \
            rdkit \
            fastapi \
            httpx \
            pydantic>=2.7 \
            pydantic-settings>=2.2 \
            uvicorn \
            sqlalchemy \
            aiosqlite \
            structlog \
            pandas \
            numpy \
            pytest>=8.1 \
            pytest-asyncio>=0.23 \
            pytest-cov>=5.0

      - name: Run tests
        run: |
          pytest tests/unit/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --tb=short \
            -q
        env:
          APP_ENV: development
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Job 3: Docker Build & Smoke Test ────────────────────────────────────────
  docker:
    name: "Docker Build + Smoke Test"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — both services start
        run: |
          docker run -d \
            --name metid-smoke \
            -e APP_ENV=production \
            -e CORS_ALLOW_ALL=true \
            -p 8000:8000 \
            -p 8501:8501 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          echo "Waiting 45s for services to initialise..."
          sleep 45

          echo "--- FastAPI health check ---"
          curl -f --retry 5 --retry-delay 5 http://localhost:8000/health

          echo "--- Streamlit health check ---"
          curl -f --retry 5 --retry-delay 5 http://localhost:8501/_stcore/health

          docker stop metid-smoke
          docker rm  metid-smoke

  # ── Job 4: Deploy to Hugging Face Spaces ────────────────────────────────────
  deploy-hf:
    name: "Deploy → Hugging Face Spaces"
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history for git push to HF

      - name: Install huggingface_hub CLI
        run: pip install huggingface_hub>=0.22

      - name: Push repository to Hugging Face Space
        env:
          HF_TOKEN:    ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python - << 'PYTHON'
          import os, subprocess
          token    = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE_ID"]          # e.g. "myuser/metid-app"
          hf_url   = f"https://user:{token}@huggingface.co/spaces/{space_id}"
          subprocess.run(
              ["git", "push", hf_url, "main"],
              check=True
          )
          print(f"Pushed to HF Space: {space_id}")
          PYTHON

  # ── Job 5: Trigger Render Deploy Hook ───────────────────────────────────────
  deploy-render:
    name: "Deploy → Render"
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set — skipping Render deploy."
            exit 0
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK")
          echo "Render deploy hook returned HTTP $HTTP_STATUS"
          [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]
