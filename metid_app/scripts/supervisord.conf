; supervisord.conf — MetID process manager
; Manages FastAPI (uvicorn) + Streamlit as co-equal services.
; supervisord itself runs as root; both child processes drop to appuser.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ── FastAPI (uvicorn) ──────────────────────────────────────────────────────────
[program:fastapi]
command=/opt/conda/envs/metid/bin/uvicorn app.main:app
    --host 0.0.0.0
    --port %(ENV_API_PORT)s
    --workers %(ENV_WORKERS)s
    --log-level %(ENV_LOG_LEVEL)s
    --no-access-log
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=5
startsecs=10
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/fastapi.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/fastapi_err.log
stderr_logfile_maxbytes=5MB
environment=PYTHONUNBUFFERED="1",RDKIT_BACKEND="Agg",MPLBACKEND="Agg"

; ── Streamlit ─────────────────────────────────────────────────────────────────
[program:streamlit]
command=/opt/conda/envs/metid/bin/streamlit run app/frontend.py
    --server.port %(ENV_STREAMLIT_PORT)s
    --server.address 0.0.0.0
    --server.headless true
    --server.enableCORS false
    --server.enableXsrfProtection false
    --theme.base dark
    --theme.primaryColor "#38bdf8"
    --theme.backgroundColor "#0a0f1e"
    --theme.secondaryBackgroundColor "#0f172a"
    --theme.textColor "#e2e8f0"
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=5
startsecs=15
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/streamlit.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/streamlit_err.log
stderr_logfile_maxbytes=5MB
environment=PYTHONUNBUFFERED="1",RDKIT_BACKEND="Agg",MPLBACKEND="Agg",HOME="/home/appuser"
