services:
  - type: web
    name: metid-api
    runtime: python
    rootDir: metid_app
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./metid.db"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MPLBACKEND
        value: Agg
      - key: RDKIT_BACKEND
        value: Agg
